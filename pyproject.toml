[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "url-discovery"
version = "0.1.0"
description = "Agente de automação inteligente para preenchimento de formulários web"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.44",
    "pydantic>=2.7",
    "faker[pt_BR]>=25.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "typer>=0.12",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["app"]